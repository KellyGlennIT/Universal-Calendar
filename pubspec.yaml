name: universal_calendar
description: A customizable multi-calendar workspace with events, date tools and bilingual support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  intl: ^0.20.2
  shared_preferences: ^2.0.0
  share_plus: ^12.0.0
  uuid: ^4.0.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.0
  image: 4.5.4
  archive: 4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/fonts/
