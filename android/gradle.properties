org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Force Kotlin compiler to run inside Gradle's process instead of a
# separate daemon — bypasses the "Could not connect to Kotlin compile
# daemon" error entirely. Slightly slower but 100% reliable.
kotlin.compiler.execution.strategy=in-process

# Give the Kotlin daemon more heap if it ever does run again
kotlin.daemon.jvm.options=-Xmx2g

# Make sure the daemon fallback is used
kotlin.daemon.useFallbackStrategy=true

# Disable Kotlin incremental compilation on Windows — this is the
# known trigger for "Daemon compilation failed: null" on Windows
kotlin.incremental=false